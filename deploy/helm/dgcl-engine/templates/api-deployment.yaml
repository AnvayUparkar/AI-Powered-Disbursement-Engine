apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgcl.fullname" . }}-api
  labels:
    {{- include "dgcl.selectorLabels" (merge (dict "component" "api") .) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "dgcl.selectorLabels" (merge (dict "component" "api") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dgcl.selectorLabels" (merge (dict "component" "api") .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "dgcl.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sharedStorage.enabled }}
      initContainers:
        {{- include "dgcl.sharedStorageInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "dgcl.backendImage" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            {{- include "dgcl.entrypoint" (concat .Values.api.command .Values.api.args) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "dgcl.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          env:
            {{- include "dgcl.redisEnv" . | nindent 12 }}
          {{- if .Values.sharedStorage.enabled }}
          volumeMounts:
            {{- include "dgcl.sharedStorageVolumeMount" . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if .Values.sharedStorage.enabled }}
      volumes:
        {{- include "dgcl.sharedStorageVolume" . | nindent 8 }}
      {{- end }}
