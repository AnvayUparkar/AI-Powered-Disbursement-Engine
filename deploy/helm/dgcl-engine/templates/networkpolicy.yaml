{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dgcl.fullname" . }}-idp
  labels:
    {{- include "dgcl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dgcl.selectorLabels" (merge (dict "component" "idp") .) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dgcl.selectorLabels" (merge (dict "component" "api") .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "dgcl.selectorLabels" (merge (dict "component" "worker") .) | nindent 14 }}
      ports:
        - port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dgcl.fullname" . }}-redis
  labels:
    {{- include "dgcl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dgcl.selectorLabels" (merge (dict "component" "api") .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "dgcl.selectorLabels" (merge (dict "component" "worker") .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "dgcl.selectorLabels" (merge (dict "component" "idp") .) | nindent 14 }}
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dgcl.fullname" . }}-frontend-to-api
  labels:
    {{- include "dgcl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dgcl.selectorLabels" (merge (dict "component" "api") .) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dgcl.selectorLabels" (merge (dict "component" "frontend") .) | nindent 14 }}
        - namespaceSelector: {} # allow the ALB Ingress Controller's proxy path
      ports:
        - port: 8000
{{- end }}
