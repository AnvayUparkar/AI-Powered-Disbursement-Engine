{{- if .Values.auth.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dgcl.fullname" . }}-auth-data
  labels:
    {{- include "dgcl.labels" . | nindent 4 }}
  annotations:
    # Losing this volume loses every account. Keep it across `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.auth.persistence.storageClassName }}
  storageClassName: {{ .Values.auth.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.auth.persistence.size }}
{{- end }}
