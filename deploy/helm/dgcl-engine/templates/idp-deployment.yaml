apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgcl.fullname" . }}-idp
  labels:
    {{- include "dgcl.selectorLabels" (merge (dict "component" "idp") .) | nindent 4 }}
spec:
  replicas: {{ .Values.idp.replicaCount }}
  selector:
    matchLabels:
      {{- include "dgcl.selectorLabels" (merge (dict "component" "idp") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dgcl.selectorLabels" (merge (dict "component" "idp") .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "dgcl.serviceAccountName" . }}
      {{- include "dgcl.podSecurityContext" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $nodeSel := .Values.idp.gpu.enabled | ternary (merge (deepCopy .Values.idp.nodeSelector) .Values.idp.gpu.nodeSelector) .Values.idp.nodeSelector }}
      {{- with $nodeSel }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := .Values.idp.gpu.enabled | ternary (concat .Values.idp.tolerations .Values.idp.gpu.tolerations) .Values.idp.tolerations }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sharedStorage.enabled }}
      initContainers:
        {{- include "dgcl.sharedStorageInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: idp
          image: {{ include "dgcl.idpImage" . }}
          imagePullPolicy: {{ .Values.idp.gpu.enabled | ternary .Values.image.backendGpu.pullPolicy .Values.image.backend.pullPolicy }}
          command:
            {{- include "dgcl.entrypoint" (concat .Values.idp.command .Values.idp.args) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.idp.port }}
          envFrom:
            - configMapRef:
                name: {{ include "dgcl.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          env:
            {{- include "dgcl.redisEnv" . | nindent 12 }}
            {{- if .Values.idp.gpu.enabled }}
            - name: IDP_ACCELERATOR_DEVICE
              value: "cuda"
            {{- end }}
          {{- if .Values.sharedStorage.enabled }}
          volumeMounts:
            {{- include "dgcl.sharedStorageVolumeMount" . | nindent 12 }}
          {{- end }}
          # Docling prewarm (idp/main.py lifespan) loads ~700MB of models before the app answers. The
          # startupProbe holds liveness/readiness off until it does, so a slow/loaded node (or a small CPU
          # limit) cannot get the pod killed mid-load. Window = periodSeconds x failureThreshold.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: {{ .Values.idp.startupFailureThreshold }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- if .Values.idp.gpu.enabled }}
            {{- toYaml .Values.idp.gpu.resources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.idp.resources | nindent 12 }}
            {{- end }}
      {{- if .Values.sharedStorage.enabled }}
      volumes:
        {{- include "dgcl.sharedStorageVolume" . | nindent 8 }}
      {{- end }}
