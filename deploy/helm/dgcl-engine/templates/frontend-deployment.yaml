{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgcl.fullname" . }}-frontend
  labels:
    {{- include "dgcl.selectorLabels" (merge (dict "component" "frontend") .) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "dgcl.selectorLabels" (merge (dict "component" "frontend") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dgcl.selectorLabels" (merge (dict "component" "frontend") .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "dgcl.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: API_UPSTREAM
              value: "{{ include "dgcl.fullname" . }}-api:8000"
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dgcl.fullname" . }}-frontend
  labels:
    {{- include "dgcl.selectorLabels" (merge (dict "component" "frontend") .) | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "dgcl.selectorLabels" (merge (dict "component" "frontend") .) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
{{- end }}
